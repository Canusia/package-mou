[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myce_mou"
version = "0.0.10"
authors = [
  { name="Avinash Kadaji", email="avi@canusia.com" },
]
description = "MyCE — MOU management with multi-stage digital signatures"
readme = "README.md"
requires-python = ">=3.8"
# Declared here, not only in setup.cfg: this [project] table has no
# `dynamic = ["dependencies"]`, so setuptools discards setup.cfg install_requires.
# myce_cis>=0.1.7a: campus-scoped school pickers (cis.highschool_scope).
dependencies = [
    "Django >= 3.2",
    "myce_cis>=0.1.7a",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/Canusia/package-mou"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"